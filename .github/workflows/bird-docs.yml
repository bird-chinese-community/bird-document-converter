name: Build Bird documentation

on:
  workflow_dispatch:
    inputs:
      bird_branch:
        description: "Bird repository branch to clone"
        required: false
        default: ""
  schedule:
    - cron: "0 0 * * 1"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: |
            /var/lib/apt/lists
            /var/cache/apt/archives
          key: ${{ runner.os }}-apt-pandoc-perl-autoconf-automake-libtool-build-essential-pkg-config-flex-bison
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc perl autoconf automake libtool build-essential pkg-config flex bison

      - name: Determine Bird branch
        id: determine-branch
        run: |
          branch="${{ github.ref_name }}"
          if [ -z "$branch" ]; then
            branch="${{ github.event.repository.default_branch || 'master' }}"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.bird_branch }}" ]; then
            branch="${{ github.event.inputs.bird_branch }}"
          fi

          bird_branch="$branch"
          if ! git ls-remote --heads https://github.com/CZ-NIC/bird.git "$bird_branch" >/dev/null 2>&1; then
            echo "Requested Bird branch '$bird_branch' not found upstream. Falling back to 'master'."
            bird_branch="master"
          fi

          {
            echo "branch=$branch"
            echo "bird_branch=$bird_branch"
          } >> "$GITHUB_OUTPUT"

      - name: Clone Bird repository
        run: |
          git clone --depth 1 --branch "${{ steps.determine-branch.outputs.bird_branch }}" https://github.com/CZ-NIC/bird.git bird-src

      - name: Prepare docs repository
        env:
          DOCS_PAT: ${{ secrets.API_TOKEN_GITHUB }}
        run: |
          set -euo pipefail
          dest_branch="${{ steps.determine-branch.outputs.branch }}"
          repo_url="https://${DOCS_PAT}@github.com/bird-chinese-community/bird-doc-markdown.git"

          if git ls-remote "$repo_url" HEAD >/dev/null 2>&1; then
            git clone "$repo_url" docs
            cd docs
            if git rev-parse --verify "origin/$dest_branch" >/dev/null 2>&1; then
              git checkout "$dest_branch"
            else
              git checkout --orphan "$dest_branch"
              git rm -rf . >/dev/null 2>&1 || true
              git clean -fd >/dev/null 2>&1 || true
            fi
          else
            git config --global init.defaultBranch master
            mkdir -p docs
            cd docs
            git init
            git remote add origin "$repo_url"
            git checkout --orphan "$dest_branch"
            git rm -rf . >/dev/null 2>&1 || true
            git clean -fd >/dev/null 2>&1 || true
          fi

      - name: Prepare Bird build system
        working-directory: bird-src
        run: |
          autoreconf -fi
          ./configure --disable-client

      - name: Build SGML documentation
        working-directory: bird-src
        run: |
          make obj/doc/bird.sgml obj/doc/prog.sgml

      - name: Convert Bird documentation
        run: |
          python3 scripts/convert_bird_docs.py --source bird-src

      - name: Commit generated documentation
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: update Bird documentation snapshot"
          repository: docs
          branch: ${{ steps.determine-branch.outputs.branch }}
          create_branch: true
          token: ${{ secrets.API_TOKEN_GITHUB }}
